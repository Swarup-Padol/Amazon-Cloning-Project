<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/2acd9be443.js" crossorigin="anonymous"></script>
    <link rel="shortcut icon" href="../Amazon-Cloning-Project/images/favicon.png" type="image/x-icon">
    <title>Online Shopping site in India: Shop Online for Mobile, Books, Watches, Shoes and More - Amazon.in</title>
</head>

<body>
    <div class="container">
        <header>
            <div class="nav_bar">
                <div class="nav_bar_left">
                    <div class="nav_logo ">
                        <div class="logo border_effect">
                        </div>
                    </div>
                    <div class="nav_bar_delivery_location border_effect">
                        <div class="current_address">
                            <p>Deliver to</p>
                        </div>
                        <div class="locater">
                            <svg xmlns="http://www.w3.org/2000/svg" class="location_dot"
                                viewBox="0 0 384 512"><!--!Font Awesome Free 6.5.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2024 Fonticons, Inc.-->
                                <path fill="#ffffff"
                                    d="M215.7 499.2C267 435 384 279.4 384 192C384 86 298 0 192 0S0 86 0 192c0 87.4 117 243 168.3 307.2c12.3 15.3 35.1 15.3 47.4 0zM192 128a64 64 0 1 1 0 128 64 64 0 1 1 0-128z" />
                            </svg>
                            <p class="update">India</p>
                        </div>
                    </div>
                </div>
                <div class="nav_bar_middle">
                    <div class="search_box">
                        <div class="nav_bar_drop_down">
                            <select class="nav_bar_drop_down_box">
                                <option value="default">All</option>
                                <option name="item">All Departement</option>
                                <option name="item">Art & Craft</option>
                                <option name="item">Automotive</option>
                                <option name="item">Art & Craft</option>
                                <option name="item">Baby</option>
                            </select>
                        </div>
                        <div class="search_panel">
                            <input type="search" name="input Box" id="input_box" placeholder="  Search  Amazon">
                        </div>
                        <div class="search_logo hover_effect">
                            <svg xmlns="http://www.w3.org/2000/svg" class="search_logo_svg"
                                viewBox="0 0 512 512"><!--!Font Awesome Free 6.5.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2024 Fonticons, Inc.-->
                                <path fill="#000000"
                                    d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z" />
                            </svg>
                        </div>
                    </div>
                </div>
                <div class="nav_bar_right">
                    <div class="language">
                        <div class="language_flag">
                            <img class="language_flag" src="./images/Flag_of_the_United_States.png" alt="American Flag">
                        </div>
                        <p id="language_text">EN</p>
                        <div id="language_arrow">
                            <svg xmlns="http://www.w3.org/2000/svg"
                                viewBox="0 0 320 512"><!--!Font Awesome Free 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.-->
                                <path fill="#73767b"
                                    d="M137.4 374.6c12.5 12.5 32.8 12.5 45.3 0l128-128c9.2-9.2 11.9-22.9 6.9-34.9s-16.6-19.8-29.6-19.8L32 192c-12.9 0-24.6 7.8-29.6 19.8s-2.2 25.7 6.9 34.9l128 128z" />
                            </svg>
                        </div>
                    </div>
                    <div class="sign_in">
                        <p id="sign_in_hello">Hello, sign in</p>
                        <p id="sign_in_account">Account & Lists
                        <div id="sign_in_arrow">
                            <svg xmlns="http://www.w3.org/2000/svg"
                                viewBox="0 0 320 512"><!--!Font Awesome Free 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.-->
                                <path fill="#73767b"
                                    d="M137.4 374.6c12.5 12.5 32.8 12.5 45.3 0l128-128c9.2-9.2 11.9-22.9 6.9-34.9s-16.6-19.8-29.6-19.8L32 192c-12.9 0-24.6 7.8-29.6 19.8s-2.2 25.7 6.9 34.9l128 128z" />
                            </svg>
                        </div>
                        </p>

                    </div>
                    <div class="return">
                        <p id="return_returns">Returns</p>
                        <p id="return_order">& Orders</p>
                    </div>
                    <div class="customer_cart">
                        <div id="customer_cart_svg">
                            <svg xmlns="http://www.w3.org/2000/svg"
                                viewBox="0 0 576 512"><!--!Font Awesome Free 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.-->
                                <path fill="#ffffff"
                                    d="M0 24C0 10.7 10.7 0 24 0L69.5 0c22 0 41.5 12.8 50.6 32l411 0c26.3 0 45.5 25 38.6 50.4l-41 152.3c-8.5 31.4-37 53.3-69.5 53.3l-288.5 0 5.4 28.5c2.2 11.3 12.1 19.5 23.6 19.5L488 336c13.3 0 24 10.7 24 24s-10.7 24-24 24l-288.3 0c-34.6 0-64.3-24.6-70.7-58.5L77.4 54.5c-.7-3.8-4-6.5-7.9-6.5L24 48C10.7 48 0 37.3 0 24zM128 464a48 48 0 1 1 96 0 48 48 0 1 1 -96 0zm336-48a48 48 0 1 1 0 96 48 48 0 1 1 0-96z" />
                            </svg>
                        </div>
                        <p id="customer_cart_text">Cart</p>
                    </div>
                </div>
            </div>
            <div class="nav_panel">
                <div class="nav_panel_all_section">
                    <div id="nav_panel_all_section_svg">
                        <svg xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 448 512"><!--!Font Awesome Free 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.-->
                            <path fill="#ffffff"
                                d="M0 96C0 78.3 14.3 64 32 64l384 0c17.7 0 32 14.3 32 32s-14.3 32-32 32L32 128C14.3 128 0 113.7 0 96zM0 256c0-17.7 14.3-32 32-32l384 0c17.7 0 32 14.3 32 32s-14.3 32-32 32L32 288c-17.7 0-32-14.3-32-32zM448 416c0 17.7-14.3 32-32 32L32 448c-17.7 0-32-14.3-32-32s14.3-32 32-32l384 0c17.7 0 32 14.3 32 32z" />
                        </svg>
                    </div>
                    <p id="nav_panel_all_section_text">All</p>
                </div>
                <div class="nav_panel_section">
                    <p id="nav_panel_deal_section">Today's Deals</p>
                    <p id="nav_panel_registery_section">Registry</p>
                    <p id="nav_panel_prime_video_section">Prime Video</p>
                    <p id="nav_panel_gift_card_section">Gift Cards</p>
                    <p id="nav_panel_customer_service">Customer Service</p>
                    <p id="nav_panel_sell_section">Sell</p>
                </div>
            </div>

        </header>
        <!-- Main Body -->
        <div class="container_body">
            <div class="hero_image">
                <div class="container_image">

                </div>
            </div>
        </div>
    </div>

</html>
